[project]
name = "dz-catalog-analysis-novosel-26-555"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BorisNN", email = "mr.boris007@mail.ru" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
dz-catalog-analysis-novosel-26-555 = "dz_catalog_analysis_novosel_26_555:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
   [tool.ruff]
   line-length = 88
   target-version = "py312"
   exclude = ["venv", ".venv", "dist", "__pycache__"]

   [tool.ruff.lint]
   select = ["E", "F", "I"]
   ignore = []